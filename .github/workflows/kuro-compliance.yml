# Kuro Rules Compliance — déployé automatiquement par sync-rules.ps1, NE PAS EDITER
# Force: fraîcheur des règles (R11/R105), fichiers protégés (R76/R101),
# qualité (R39/R64), version (R91), standard tooling (R112),
# split PLAN/ROADMAP (R106), nommage de branche (R30).
# Miroir allégé de .github/workflows/compliance.yml (kuro-rules central).
name: kuro-rules-compliance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: R76/R106 - fichiers prives non tracks
        run: |
          # Pattern-based check (R76) — miroir compliance.yml central
          PROTECTED='^(PLAN|SESSION_SUMMARY|acquisition_tracker|decision-memo|LAUNCH_POSTS|decision)\.md$|^\.env$|credentials\.json$|service_account.*\.json$|\.pem$|\.key$|\.p12$'
          VIOLATIONS=$(git ls-files | grep -E "$PROTECTED" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Fichiers proteges trackes (R76/R106):"
            echo "$VIOLATIONS"
            echo "Fix: git rm --cached <file>"
            exit 1
          fi
          echo "OK: aucun fichier protege tracke."

      - name: R101 - pas de secrets dans le diff
        run: |
          if git diff HEAD~1 2>/dev/null | grep -qiE "(api_key|apikey|secret|password)\s*=\s*['\"]\w{8,}"; then
            echo "::error title=R101::Secret potentiel detecte dans le diff."
            exit 1
          fi
          if git ls-files | grep -qx '\.env'; then
            echo "::error title=R101::Fichier .env tracke."
            exit 1
          fi
          echo "OK: pas de secret detecte (R101)."

      - name: R39 - pas de assert en prod
        run: |
          if [ -d "neuraldbg" ] || [ -d "src" ] || [ -d "sugar" ]; then
            VIOLATIONS=$(grep -rn "assert " --include="*.py" . --exclude-dir=tests --exclude-dir=test --exclude-dir=.venv 2>/dev/null | grep -v "assert isinstance\|assert __name__" | head -20 || true)
            if [ -n "$VIOLATIONS" ]; then
              echo "::error title=R39::assert() en prod:"
              echo "$VIOLATIONS"
              exit 1
            fi
          fi
          echo "OK: pas de assert en prod (R39)."

      - name: R64/R2 - pas de mot workaround
        run: |
          VIOLATIONS=$(grep -rn "workaround" --include="*.py" --include="*.md" . --exclude-dir=.venv --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null | grep -v "PR_GATE.md\|DEV_RULES.md\|pr_gate_check\|rule_\|prompts/\|install_hooks.py" | head -10 || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error title=R64::Mot 'workaround' detecte."
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "OK: pas de workaround (R64)."

      - name: R91 - coherence version (si pyproject + CHANGELOG)
        run: |
          if [ -f "pyproject.toml" ] && [ -f "CHANGELOG.md" ]; then
            VERSION=$(grep 'version\s*=' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ -n "$VERSION" ]; then
              if grep -q "\[$VERSION\]" CHANGELOG.md; then
                echo "OK: version $VERSION dans CHANGELOG (R91)."
              else
                echo "::warning::Version $VERSION absente de CHANGELOG.md (R91)."
              fi
            fi
          else
            echo "OK: pas de check version applicable (R91)."
          fi

      - name: Regles AGENTS.md presentes et non alterees (manifest)
        run: |
          if [ ! -f AGENTS.md ]; then
            echo "::error::AGENTS.md absent - lancer sync-rules.ps1 depuis kuro-rules"
            exit 1
          fi
          if [ ! -f .kuro/rules-manifest.json ]; then
            echo "::warning::Pas de manifest .kuro/rules-manifest.json - synchro ancienne, fraicheur non verifiable"
            exit 0
          fi
          EXPECTED=$(python3 -c "import json;print(json.load(open('.kuro/rules-manifest.json'))['agentsSha256'])")
          EXPECTED_COUNT=$(python3 -c "import json;print(json.load(open('.kuro/rules-manifest.json'))['ruleCount'])")
          ACTUAL=$(sha256sum AGENTS.md | cut -d' ' -f1)
          ACTUAL_COUNT=$(grep -c '^\- \*\*rule_' AGENTS.md || true)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::AGENTS.md a derive du dernier manifest de synchro (edition locale ou synchro manquee). Relancer sync-rules.ps1."
            exit 1
          fi
          if [ "$ACTUAL_COUNT" != "$EXPECTED_COUNT" ]; then
            echo "::error::Index de regles incoherent ($ACTUAL_COUNT vs $EXPECTED_COUNT attendues)."
            exit 1
          fi
          echo "OK: $ACTUAL_COUNT regles, hash conforme au manifest."

      - name: R30 - nommage de branche (PR uniquement)
        if: github.event_name == 'pull_request'
        run: |
          BR="${GITHUB_HEAD_REF}"
          if echo "$BR" | grep -qE '^(main|master|develop|feat/|fix/|infra/|ceo/|sec/|chore/|docs/|test/)'; then
            echo "OK: branche '$BR' conforme (R30)."
          else
            echo "::error title=R30::Branche '$BR' viole la convention. Valides: main, master, develop, feat/*, fix/*, infra/*, ceo/*, sec/*, chore/*, docs/*, test/*"
            exit 1
          fi

      - name: R106 - ROADMAP.md public present (avertissement)
        run: |
          if [ ! -f ROADMAP.md ]; then
            echo "::warning::ROADMAP.md absent (R106) - creer un roadmap public."
          else
            echo "OK: ROADMAP.md present."
          fi

      - name: R112 - standard tooling + pre-commit (avertissement)
        run: |
          if [ ! -f .pre-commit-config.yaml ]; then
            echo "::warning::.pre-commit-config.yaml absent (R112) - relancer sync-rules.ps1 (OWNED) ou install.ps1."
          else
            echo "OK: pre-commit present (R112)."
          fi
          if [ ! -d ".codebase-memory" ] && [ ! -f ".codebase-memory/graph.db.zst" ]; then
            echo "::warning::Index codebase-memory absent (R112) - indexer via codebase-memory-mcp."
          fi
          if ! command -v agent-reach >/dev/null 2>&1; then
            echo "::warning::agent-reach non installé sur ce runner (R112) - vérification locale uniquement."
          fi
