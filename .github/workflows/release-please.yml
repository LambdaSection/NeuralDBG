# release-please — deployed by sync-rules.ps1 (kuro-rules fleet), DO NOT EDIT BY HAND
# Cuts version bumps + CHANGELOG entries + tags + GitHub releases from
# conventional commits. Complements tag-triggered build workflows.
# Spec: VERSIONING.md (kuro-rules).
name: release-please

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
